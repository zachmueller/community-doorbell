<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Doorbell</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #f5f5f5; padding: 20px;
        }
        .container { text-align: center; max-width: 400px; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        #ring-btn {
            font-size: 1.5rem; padding: 20px 40px; border: none;
            border-radius: 16px; cursor: pointer; transition: all 0.2s;
            background: #2563eb; color: white;
        }
        #ring-btn:hover { background: #1d4ed8; transform: scale(1.02); }
        #ring-btn:active { transform: scale(0.98); }
        #ring-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        .inactive { color: #888; font-size: 1.2rem; }
        #response { margin-top: 1.5rem; font-size: 1.1rem; color: #16a34a; min-height: 1.5em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Event Doorbell</h1>
        <p class="subtitle">Tap the button and we'll come let you in!</p>
        <div id="active-view" style="display:none;">
            <button id="ring-btn" onclick="ring()">Ring the Doorbell</button>
            <p id="response"></p>
        </div>
        <div id="inactive-view" style="display:none;">
            <p class="inactive">No event is happening right now.</p>
        </div>
        <div id="loading-view">
            <p class="inactive">Loading...</p>
        </div>
    </div>
    <script>
        let API = '';

        async function init() {
            const cfg = await fetch('/runtime-config.json').then(r => r.json());
            API = cfg.apiUrl.replace(/\/$/, '');
            checkStatus();
        }

        async function checkStatus() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById(data.active ? 'active-view' : 'inactive-view').style.display = 'block';
            } catch (e) {
                document.getElementById('loading-view').innerHTML =
                    '<p class="inactive">Unable to reach doorbell service.</p>';
            }
        }

        async function ring() {
            const btn = document.getElementById('ring-btn');
            const resp = document.getElementById('response');
            btn.disabled = true;
            btn.textContent = 'Ringing...';
            resp.textContent = '';
            try {
                const res = await fetch(`${API}/ring`, { method: 'POST' });
                const data = await res.json();
                resp.textContent = data.message;
                btn.textContent = 'Rang!';
                setTimeout(() => { btn.disabled = false; btn.textContent = 'Ring the Doorbell'; }, 30000);
            } catch (e) {
                resp.textContent = 'Something went wrong. Try again?';
                btn.disabled = false;
                btn.textContent = 'Ring the Doorbell';
            }
        }

        init();
    </script>
</body>
</html>
